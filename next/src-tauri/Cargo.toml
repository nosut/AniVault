[package]
name = "taiga-next"
version = "0.1.0"
description = "Clean-room Taiga successor"
authors = ["Taiga Next Contributors"]
edition = "2021"

[lib]
name = "taiga_next"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0.97"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.11"
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.4.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync"] }
windows = { version = "0.61.1", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
