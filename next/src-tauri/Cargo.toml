[package]
name = "anivault"
version = "1.0.6"
description = "AniVault desktop anime library"
authors = ["AniVault Contributors"]
edition = "2021"

[lib]
name = "anivault_core"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0.97"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.11"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
rand = "0.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
urlencoding = "2"
open = "5"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.4.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync"] }
windows = { version = "0.61.1", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-appender = "0.2"
