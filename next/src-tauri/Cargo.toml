[package]
name = "anivault"
version = "0.1.0"
description = "AniVault desktop anime library"
authors = ["AniVault Contributors"]
edition = "2021"

[lib]
name = "anivault_core"
crate-type = ["rlib"]

[[bin]]
name = "anivault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
regex-lite = "0.1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.4.0", features = [] }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync"] }
windows = { version = "0.61.1", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
